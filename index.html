<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  :root {
    --bg: #f2f2f5; --panel: #ffffff; --text: #1c1c1e; --muted: #6e6e73;
    --key: #e9e9ee; --key-hover: #dcdce2; --op: #ff9f0a; --op-text: #fff; --fn: #d4d4d9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --panel: #1c1c1e; --text: #f5f5f7; --muted: #8e8e93;
      --key: #333336; --key-hover: #444448; --fn: #5a5a5e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .calc {
    width: 320px; background: var(--panel); border-radius: 16px; padding: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.15);
  }
  .display { text-align: right; padding: 8px 8px 16px; min-height: 96px; }
  .expr { color: var(--muted); font-size: 16px; min-height: 20px; word-break: break-all; }
  .value { font-size: 44px; font-weight: 300; word-break: break-all; line-height: 1.1; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button {
    height: 60px; border: 0; border-radius: 12px; font-size: 22px; cursor: pointer;
    background: var(--key); color: var(--text); font-family: inherit;
    transition: background .1s, transform .05s;
  }
  button:hover { background: var(--key-hover); }
  button:active, button.pressed { transform: scale(.96); }
  button.fn { background: var(--fn); }
  button.op { background: var(--op); color: var(--op-text); }
  button.op.active { background: var(--op-text); color: var(--op); }
  button.zero { grid-column: span 2; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-action="clear" id="clear">AC</button>
    <button class="fn" data-action="sign">±</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-op="/">÷</button>
    <button data-digit="7">7</button>
    <button data-digit="8">8</button>
    <button data-digit="9">9</button>
    <button class="op" data-op="*">×</button>
    <button data-digit="4">4</button>
    <button data-digit="5">5</button>
    <button data-digit="6">6</button>
    <button class="op" data-op="-">−</button>
    <button data-digit="1">1</button>
    <button data-digit="2">2</button>
    <button data-digit="3">3</button>
    <button class="op" data-op="+">+</button>
    <button class="zero" data-digit="0">0</button>
    <button data-action="decimal">.</button>
    <button class="op" data-action="equals">=</button>
  </div>
  <div class="hint">Keyboard: 0–9 . + − * / Enter Backspace Esc</div>
</div>

<script>
const SYMBOL = { "+": "+", "-": "−", "*": "×", "/": "÷" };
const state = { current: "0", previous: null, op: null, fresh: false, lastOp: null, lastOperand: null };

const valueEl = document.getElementById("value");
const exprEl = document.getElementById("expr");
const clearEl = document.getElementById("clear");

function compute(a, b, op) {
  switch (op) {
    case "+": return a + b;
    case "-": return a - b;
    case "*": return a * b;
    case "/": return b === 0 ? NaN : a / b;
  }
}

function format(n) {
  if (!isFinite(n)) return "Error";
  // Trim floating-point noise like 0.1 + 0.2 = 0.30000000000000004
  const r = parseFloat(n.toPrecision(12));
  return Math.abs(r) >= 1e12 || (r !== 0 && Math.abs(r) < 1e-9) ? r.toExponential(6) : String(r);
}

function render() {
  valueEl.textContent = state.current;
  const len = state.current.length;
  valueEl.style.fontSize = len > 12 ? "28px" : len > 9 ? "36px" : "44px";
  exprEl.textContent = state.op ? `${state.previous} ${SYMBOL[state.op]}` : "";
  clearEl.textContent = state.current !== "0" && !state.fresh ? "C" : "AC";
  document.querySelectorAll("[data-op]").forEach(b =>
    b.classList.toggle("active", state.fresh && b.dataset.op === state.op));
}

function inputDigit(d) {
  if (state.current === "Error") state.current = "0";
  if (state.fresh) { state.current = d; state.fresh = false; }
  else if (state.current.replace(/[-.]/g, "").length >= 15) return;
  else state.current = state.current === "0" ? d : state.current + d;
}

function inputDecimal() {
  if (state.fresh || state.current === "Error") { state.current = "0."; state.fresh = false; }
  else if (!state.current.includes(".")) state.current += ".";
}

function setOp(op) {
  if (state.current === "Error") return;
  if (state.op && !state.fresh) {
    state.current = format(compute(parseFloat(state.previous), parseFloat(state.current), state.op));
    if (state.current === "Error") { state.op = null; state.previous = null; state.fresh = true; return; }
  }
  state.previous = state.current;
  state.op = op;
  state.fresh = true;
}

function equals() {
  if (state.current === "Error") return;
  if (state.op) {
    const b = state.fresh ? state.previous : state.current;
    state.lastOp = state.op;
    state.lastOperand = b;
    exprEl.textContent = "";
    state.current = format(compute(parseFloat(state.previous), parseFloat(b), state.op));
    state.op = null;
    state.previous = null;
  } else if (state.lastOp) {
    // Repeat last operation on repeated "="
    state.current = format(compute(parseFloat(state.current), parseFloat(state.lastOperand), state.lastOp));
  }
  state.fresh = true;
}

function clear() {
  if (state.current !== "0" && !state.fresh) state.current = "0";
  else Object.assign(state, { current: "0", previous: null, op: null, fresh: false, lastOp: null, lastOperand: null });
}

function backspace() {
  if (state.fresh || state.current === "Error") return;
  state.current = state.current.length > 1 && state.current !== "-0" ? state.current.slice(0, -1) : "0";
  if (state.current === "-") state.current = "0";
}

function sign() {
  if (state.current === "Error" || state.current === "0") return;
  state.current = state.current.startsWith("-") ? state.current.slice(1) : "-" + state.current;
  if (state.fresh && !state.op) state.fresh = false;
}

function percent() {
  if (state.current === "Error") return;
  const n = parseFloat(state.current);
  // With + or −, 50 + 10% means 10% of 50
  const v = state.op && (state.op === "+" || state.op === "-") ? parseFloat(state.previous) * n / 100 : n / 100;
  state.current = format(v);
  state.fresh = false;
}

document.querySelector(".keys").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.digit) inputDigit(b.dataset.digit);
  else if (b.dataset.op) setOp(b.dataset.op);
  else ({ clear, sign, percent, decimal: inputDecimal, equals })[b.dataset.action]();
  render();
});

const KEYMAP = { Enter: "equals", "=": "equals", ".": "decimal", ",": "decimal", Escape: "clear", Delete: "clear", "%": "percent" };
document.addEventListener("keydown", e => {
  let btn = null;
  if (/^[0-9]$/.test(e.key)) { inputDigit(e.key); btn = `[data-digit="${e.key}"]`; }
  else if (SYMBOL[e.key]) { setOp(e.key); btn = `[data-op="${e.key}"]`; }
  else if (e.key === "Backspace") backspace();
  else if (KEYMAP[e.key]) {
    const a = KEYMAP[e.key];
    ({ clear, percent, decimal: inputDecimal, equals })[a]();
    btn = a === "equals" ? `[data-action="equals"]` : `[data-action="${a}"]`;
  } else return;
  e.preventDefault();
  if (btn) {
    const el = document.querySelector(btn);
    el.classList.add("pressed");
    setTimeout(() => el.classList.remove("pressed"), 100);
  }
  render();
});

render();
</script>
</body>
</html>
